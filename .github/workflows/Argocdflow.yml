name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout Application
        uses: actions/checkout@v4


      # -------------------------
      # Login to GHCR
      # -------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -------------------------
      # Build Image
      # -------------------------

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .


      # -------------------------
      # Push Image
      # -------------------------

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


      # -------------------------
      # Update GitOps Repository
      # -------------------------

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/myapp-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops


      # -------------------------
      # Update Image
      # -------------------------

      - name: Update Kubernetes Image
        run: |

          cd gitops

          sed -i \
          "s|image:.*|image: $IMAGE_NAME:${{ github.sha }}|" \
          apps/myapp/deployment.yaml


      # -------------------------
      # Commit Changes
      # -------------------------

      - name: Commit GitOps Change
        run: |

          cd gitops

          git config user.name "github-actions"

          git config user.email \
            "github-actions@github.com"

          git add apps/myapp/deployment.yaml

          git commit \
            -m "Update myapp image to ${{ github.sha }}" || true

          git push
