name: kubernetes CI
on:
  push:
    branches:
      - main
jobs:
  argocd-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Run Tests
        run: |
          echo "Running tests..."
      - name: Build Docker Image
        run: |
          docker build \
            -t myapp:${{ github.sha }} .
